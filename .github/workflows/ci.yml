name: checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-host-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Lean manager
        run: |
          python3 scripts/bootstrap_tool.py elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Model, regression, gate, and host checks
        run: |
          mkdir -p build/evidence
          bash scripts/check.sh 2>&1 | tee build/evidence/check.log
      - name: Native compiler artifact and execution
        run: |
          cake=$(python3 scripts/bootstrap_tool.py cake)
          python3 scripts/native_check.py --cake "$cake" | tee build/evidence/native.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-host-native-evidence
          path: |
            build/evidence/
            build/native/report.json
            build/native/region.pnk
            build/native/region.S

  concurrency-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bounded interleaving exploration
        run: |
          mkdir -p build/evidence
          python3 scripts/check_models.py --loom 2>&1 | tee build/evidence/loom.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: concurrency-evidence
          path: build/evidence/
