name: scheduled
on:
  schedule:
    - cron: "17 3 * * *"
  # A run by hand can repeat a night of the generated lane: the summary of every run names the
  # values to give here. It runs every job of this workflow, from the head of the default branch.
  workflow_dispatch:
    inputs:
      seed:
        description: Seed of the generated programs, at most 20 digits; empty takes the date
        type: string
        default: ""
      count:
        description: Generated programs to draw
        type: string
        default: "5000"
      vectors:
        description: Inputs for each generated program
        type: string
        default: "8"

permissions: {}

defaults:
  run:
    shell: bash

# As in the per-commit chain: a module in scripts/ named like a standard-library one cannot
# shadow it, and Lean runs on four threads.
env:
  PYTHONSAFEPATH: "1"
  LEAN_NUM_THREADS: "4"

jobs:
  # New advisories appear without any change to the repository.
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: RustSec advisories
        run: |
          deny=$(python3 -P scripts/bootstrap_tool.py cargo-deny)
          "$deny" --locked check advisories
          "$deny" --locked --manifest-path models/Cargo.toml check advisories

  # The concurrency tests are only evidence while they can fail. This replays the
  # recorded defects against a copy of the tree and requires each one to go red.
  # It takes minutes, so it runs here rather than in the per-commit chain.
  rust-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mutations the concurrency tests must catch
        run: python3 -P scripts/mutate_rust.py

  # Miri interprets the unsafe code of the ring model (slot writes through
  # `UnsafeCell` and `MaybeUninit`) and reports undefined behaviour the ordinary
  # test run cannot see. It needs a nightly toolchain, so it stays out of the
  # pinned build. It reports on the schedules it runs, one per test, and not on
  # the interleavings loom explores; the loom tests themselves are compiled out
  # here, because they need their own cfg and their own runtime. Miri is an
  # interpreter, so the wall time follows single-core speed, not the core count.
  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Miri
        run: |
          rustup toolchain install nightly-2026-09-01 --profile minimal --component miri
          rustup run nightly-2026-09-01 cargo miri setup
      # Many seeds: one schedule per run says little about a program whose bugs live in the
      # schedule. Each seed costs a whole run, so the stress tests carry a smaller item count
      # under Miri; the symbolic alignment check refuses a pointer that is aligned by luck.
      - name: Undefined behaviour in the ring model
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-many-seeds=0..32"
        run: |
          rustup run nightly-2026-09-01 cargo miri test --locked \
            --manifest-path models/Cargo.toml -p dn-ring-model

  # The host C is the part of the running program no theorem covers: the proofs are about the
  # generated code, not about the loop that calls it. This reads it for the defects that code
  # is written to avoid by hand — a write past a buffer, a pointer used after free, a format
  # string from data. It runs here rather than on a pull request because it needs write access
  # to the security results, and the per-commit chain runs code from the change.
  codeql-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: c-cpp
          build-mode: manual
      # Compiling alone is enough for the database: linking needs the generated assembly, and
      # what is read here is the host's own source.
      # The same flags the native lane compiles with, minus the link-only ones: a database built
      # from different flags describes a program nobody runs.
      - name: Compile the host
        run: |
          for source in native/*.c; do
            cc -O2 -Wall -Wextra -Werror -fPIE -D_FORTIFY_SOURCE=3 -fstack-protector-strong \
              -fstack-clash-protection -fcf-protection=full -Wformat=2 -I native \
              -c "$source" -o "${RUNNER_TEMP}/$(basename "$source").o"
          done
      - uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1

  # The per-commit lane runs each property over proptest's default number of cases, which is
  # about finding a defect quickly rather than deeply. This runs the same properties far longer.
  properties:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Properties over many more cases
        env:
          PROPTEST_CASES: "200000"
        run: |
          cargo test --locked -p dn-runtime --test properties
          cargo test --locked --manifest-path models/Cargo.toml -p dn-ring-model --test properties
      # A counterexample is written beside the test and belongs in the repository; a run that
      # found one and threw it away has to find it again.
      - name: Keep any counterexample it found
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proptest-regressions
          path: "**/*.proptest-regressions"
          if-no-files-found: ignore

  # CI runs the native lanes one after another in one checkout, so a lane that leans on what an
  # earlier one left in build/ passes there and fails alone. Here each runs on a machine of its
  # own, the generated lane at its standard size.
  lanes-alone:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [native, baseline, entry, server, parser, fuzz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Lean manager
        run: |
          python3 scripts/bootstrap_tool.py elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Link the digest-pinned Lean toolchain
        run: python3 scripts/bootstrap_tool.py lean
      - name: Source gate and build
        run: bash scripts/check.sh build
      - name: The lane alone
        env:
          LANE: ${{ matrix.lane }}
        run: bash scripts/native_lanes.sh "${LANE}"

  # The per-commit lane draws generated programs from one fixed seed. This draws many more, from
  # a seed taken from the date, so each night looks somewhere new; the run's summary gives the
  # seed and how to repeat it, and a disagreement it finds is reduced and kept.
  generated-programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Lean manager
        run: |
          python3 scripts/bootstrap_tool.py elan
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Link the digest-pinned Lean toolchain
        run: python3 scripts/bootstrap_tool.py lean
      - name: Source gate and build
        run: bash scripts/check.sh build
      - name: Programs from a new seed
        env:
          SEED: ${{ inputs.seed }}
          COUNT: ${{ inputs.count || '5000' }}
          VECTORS: ${{ inputs.vectors || '8' }}
        run: |
          seed=${SEED:-$(date -u +%Y%m%d)}
          echo "seed ${seed}"
          [[ "${seed}" =~ ^[0-9]{1,20}$ ]] || { echo "the seed is up to 20 digits, not '${seed}'" >&2; exit 2; }
          [[ "${COUNT}" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "count is 1 to 999999, not '${COUNT}'" >&2; exit 2; }
          [[ "${VECTORS}" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "vectors is 1 to 999, not '${VECTORS}'" >&2; exit 2; }
          options="--seed ${seed} --count ${COUNT} --vectors ${VECTORS}"
          {
            echo "Generated programs from seed ${seed}: ${COUNT} programs, ${VECTORS} inputs each, at ${GITHUB_SHA}."
            echo
            echo "Again here, with every nightly job, at the head of the default branch:"
            echo "\`gh workflow run scheduled.yml -f seed=${seed} -f count=${COUNT} -f vectors=${VECTORS}\`"
            echo
            echo "Again locally, at ${GITHUB_SHA}, after \`bash scripts/check.sh build\`:"
            echo "\`python3 scripts/native_fuzz.py --cake \"\$(python3 scripts/bootstrap_tool.py cake)\" ${options}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          cake=$(python3 scripts/bootstrap_tool.py cake)
          python3 scripts/native_fuzz.py --cake "${cake}" --seed "${seed}" --count "${COUNT}" --vectors "${VECTORS}"
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-programs
          path: |
            build/fuzz/minimized/
            build/fuzz/programs.json
            build/fuzz/parser/
          if-no-files-found: ignore
          retention-days: 90

  # The upstream files the semantics was transcribed from and the keyword table was
  # generated from must still be those files, the stored RFCs must still be what their
  # urls serve, and every file the extraction manifest records must still hash to what
  # it says; this needs network, so it is not in the offline build.
  upstream-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recorded digests
        run: python3 -P scripts/check_upstream_sources.py
      - name: Generated keyword table
        run: python3 -P scripts/gen_keywords.py --check
