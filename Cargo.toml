[workspace]
members = ["crates/dn-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
