[package]
name = "dn-borrow-recycle-model"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Executable model of the io_uring provided-buffer borrow<->recycle cross-thread handoff, built for bounded schedule exploration under loom. A separate crate so loom's unwind-based panic capture is not polluted by a linked Lean runtime."
publish = false

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
