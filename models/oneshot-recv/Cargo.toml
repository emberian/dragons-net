[package]
name = "dn-oneshot-recv-model"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Executable model of the one-shot buffer-select recv path of the historical reactor (uring.rs recv_br_sqe/on_recv_br): the per-request lease acquire->process->recycle cycle through the single Conn.leased_bid cell, recycle-exactly-once, and buffer conservation with no cross-request lease leak. Built for schedule exploration under loom; a bound is set per test, never globally. A crate of its own so loom's unwind-based panic capture is not polluted by a linked Lean runtime."
publish = false

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
dn-borrow-recycle-model = { path = "../borrow-recycle" }

[lints]
workspace = true
