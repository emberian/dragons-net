[package]
name = "dn-ring-model"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Executable model of a bounded SPSC ring with free-running counters and check-register-recheck waker handoff, built for schedule exploration under loom, with any preemption bound set per test."
publish = false

# Properties over generated operation sequences. Scoped to `cfg(not(loom))` so that the loom
# and Miri lanes do not build it: the test itself is compiled out there.
[target.'cfg(not(loom))'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints]
workspace = true
